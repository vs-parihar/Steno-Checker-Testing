<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Steno Checker Pro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific styles for the new checking features */
        #checkV { line-height: 1.8; font-size: 1.1rem; padding: 10px; background: var(--p-bg); border-radius: 8px; border: 1px solid var(--bd); }
        .c-ok { color: var(--fg); opacity: 0.9; cursor: pointer; }
        .c-ins { color: var(--sky); cursor: pointer; font-weight: bold; }
        .c-sub-f { color: var(--re); cursor: pointer; font-weight: bold; text-decoration: line-through; }
        .c-sub-h { color: var(--in); cursor: pointer; font-weight: bold; }
        .c-cor { color: var(--gr); font-weight: normal; font-size: 0.85em; margin-left: 3px; text-decoration: none !important; }
        .sup { font-size: 0.6em; vertical-align: super; margin-left: 2px; opacity: 0.8; }
        
        #eL { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .e-row { background: var(--inp-bg); border: 1px solid var(--bd); border-left: 4px solid var(--in); padding: 8px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .e-row.active { outline: 2px solid var(--in); background: #1a1a1a; }
        .e-ctx { font-size: 0.9em; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .e-ctx b { color: var(--fg); }
        .e-info { font-size: 0.7em; text-transform: uppercase; font-weight: bold; color: var(--in); width: 80px; text-align: right; }
        
        #ctxM { position: fixed; background: #222; border: 1px solid #444; display: none; z-index: 1000; border-radius: 4px; padding: 4px; box-shadow: 0 4px 12px #000; }
        #ctxM button { padding: 4px 8px; font-size: 12px; margin: 0 2px; }
        .hl-ctx { background: rgba(99,102,241,0.2); border-radius: 2px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="card">
            <div class="row" style="justify-content:flex-start">
                <button onclick="$('f').click()" style="padding:0 12px">📁 Open</button>
                <button onclick="openM()" id="libBtn" style="padding:0 12px">🌐 Audios</button>
                <button onclick="opTr()" style="padding:0 12px; border-color:var(--sky)">⌨️ Transcribe</button>
                <button id="exB" style="width:32px; margin-left:auto" onclick="expA()">⬇️</button>
            </div>
            <input type="file" id="f" hidden multiple>
            
            <div class="row">
                <div style="width:50px"><label class="lbl">Words</label><input type="number" id="wc" value="0" style="width:100%" readonly></div>
                <div style="flex:1">
                    <label class="lbl">Hindi Text (Source)</label>
                    <textarea id="tx" oninput="upWC()" placeholder="Paste source text here..."></textarea>
                </div>
            </div>
        </div>

        <div id="resBox" class="card" style="display:none; flex:1; overflow-y:auto;">
            <div class="row" style="justify-content:space-between; margin-bottom:10px">
                <div id="st" style="font-weight:bold; color:var(--gr)">Accuracy: --%</div>
                <button onclick="$('resBox').style.display='none'" style="width:auto; padding:2px 10px">Close Result</button>
            </div>
            <div id="checkV"></div>
            <div id="eL"></div>
        </div>

        <div id="trM" class="modal">
            <div class="modal-inner">
                <div class="row" style="justify-content:space-between">
                    <b id="trInf">Ready</b>
                    <b id="trT">00:00</b>
                </div>
                <textarea id="trI" placeholder="Start typing here..." style="flex:1; margin:10px 0; font-size:1.1rem"></textarea>
                <div class="row" style="gap:10px">
                    <button id="trA" onclick="togTr()" style="flex:2; background:var(--in); color:white">Start</button>
                    <button onclick="cfmAct('c')" style="flex:1; border-color:var(--re); color:var(--re)">Cancel</button>
                </div>
            </div>
        </div>

        <div id="ctxM"></div>

        <input type="hidden" id="trC" value="0">
        <input type="checkbox" id="chkFull" style="display:none">
    </div>

    <script src="config.js"></script>
    <script src="processor.js"></script>
    <script src="checker.js"></script>
    <script src="audio-engine.js"></script>
    <script src="ui-controller.js"></script>
    <script>
        // Global click to close context menu
        document.addEventListener('click', () => { $('ctxM').style.display='none'; });
        
        // Ensure accuracy updates when window is resized or zoomed
        window.addEventListener('resize', upWC);
    </script>
</body>
</html>
